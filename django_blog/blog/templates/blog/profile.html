{% extends 'blog/base.html' %}
{% block content %}
<h2>Profile</h2>
<form method="POST">
    {% csrf_token %}
    <label>Username:</label>
    <input type="text" name="username" value="{{ request.user.username }}"><br>
    <label>Email:</label>
    <input type="email" name="email" value="{{ request.user.email }}"><br>
    <button type="submit">Update</button>
</form>
<a href="{% url 'blog:logout' %}">Logout</a>
{% endblock %}
