{% extends 'blog/base.html' %}
{% block content %}
<h2>{{ post.title }}</h2>
<p>{{ post.content }}</p>
<p>By {{ post.author.username }} on {{ post.published_date|date:"M d, Y" }}</p>

{% if request.user == post.author %}
    <a href="{% url 'blog:post_update' post.pk %}">Edit</a> |
    <a href="{% url 'blog:post_delete' post.pk %}">Delete</a>
{% endif %}
<a href="{% url 'blog:post_list' %}">Back to All Posts</a>
{% endblock %}
